<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | SelaSI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    [hidden]{display:none!important}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:"Poppins",system-ui,sans-serif;color:#1f3a22;background:#f7f9e4}
    .card{width:100%;max-width:420px;padding:36px 32px;border-radius:24px;background:#fff;border:1px solid #e3ebc6;box-shadow:0 20px 40px rgba(47,82,48,.12)}
    .brand{display:flex;align-items:center;gap:10px;margin:0 0 22px;font-weight:600;font-size:1.3rem;color:#2f5230;text-decoration:none}
    .brand svg{width:30px;height:30px}
    h1{margin:0 0 6px;font-size:1.5rem;color:#2f5230}
    .sub{margin:0 0 22px;font-size:.9rem;line-height:1.6;color:#5d7549}
    .field{margin-bottom:16px}
    label{display:block;margin:0 0 6px;font-size:.84rem;font-weight:600;color:#2f5230}
    input{width:100%;padding:12px 14px;border:2px solid #d5e2b3;border-radius:12px;background:#fff;font:inherit;font-size:.94rem;color:#1f3a22}
    input:focus-visible,.btn:focus-visible,a:focus-visible,.toggle:focus-visible{outline:3px solid #8fbf4d;outline-offset:2px}
    .pw{position:relative}
    .pw input{padding-right:104px}
    .toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);padding:6px 10px;border:0;border-radius:8px;background:#eef3d8;color:#2f5230;font:inherit;font-size:.78rem;font-weight:600;cursor:pointer}
    .code{letter-spacing:.4em;text-align:center;font-weight:600;text-transform:uppercase}
    .btn{width:100%;padding:13px;border:0;border-radius:999px;background:#2f5230;color:#fff;font:inherit;font-weight:600;font-size:.95rem;cursor:pointer}
    .btn:hover{background:#1f3a22}
    .btn:disabled{background:#8fa58a;cursor:wait}
    .links{display:flex;justify-content:space-between;gap:12px;margin-top:16px;font-size:.86rem}
    .links a{color:#2f5230;font-weight:500}
    .alert{padding:12px 16px;border-radius:12px;margin:0 0 16px;font-size:.88rem;line-height:1.5}
    .alert.error{background:#fde8e3;color:#b3321b}
    .alert.success{background:#e3f3d2;color:#25611f}
  </style>
</head>
<body>
  <main class="card">
    <a class="brand" href="../index.html" aria-label="SelaSI, kembali ke beranda">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21v-9"/><path d="M12 13c0-4 3-6 7-6 0 4-3 6-7 6z"/><path d="M12 16c0-3-2-5-6-5 0 3 2 5 6 5z"/></svg>
      SelaSI
    </a>

    <form id="form-login" novalidate>
      <h1>Masuk</h1>
      <p class="sub">Gunakan akun Pembudidaya untuk mengelola kebunmu.</p>
      <div id="alert-login" class="alert" role="alert" hidden></div>
      <div class="field"><label for="login-email">Email</label><input type="email" id="login-email" autocomplete="email" required></div>
      <div class="field"><label for="login-password">Password</label>
        <div class="pw"><input type="password" id="login-password" autocomplete="current-password" required><button type="button" class="toggle" data-target="login-password">Lihat</button></div>
      </div>
      <button type="submit" class="btn" id="btn-login">Masuk</button>
      <div class="links"><a href="#" id="link-forgot">Lupa password?</a><a href="../index.html">Beranda</a></div>
    </form>

    <form id="form-forgot" novalidate hidden>
      <h1>Lupa password</h1>
      <p class="sub">Masukkan email akunmu. Kami kirim kode verifikasi ke email itu.</p>
      <div id="alert-forgot" class="alert" role="alert" hidden></div>
      <div class="field"><label for="forgot-email">Email pemulihan</label><input type="email" id="forgot-email" autocomplete="email" required></div>
      <button type="submit" class="btn" id="btn-forgot">Kirim kode</button>
      <div class="links"><a href="#" data-back>Kembali ke login</a></div>
    </form>

    <form id="form-code" novalidate hidden>
      <h1>Masukkan kode</h1>
      <p class="sub" id="code-hint"></p>
      <div id="alert-code" class="alert" role="alert" hidden></div>
      <div class="field"><label for="code-input">Kode verifikasi</label><input type="text" id="code-input" class="code" maxlength="6" autocomplete="one-time-code" required></div>
      <button type="submit" class="btn" id="btn-code">Periksa kode</button>
      <div class="links"><a href="#" data-back>Kembali ke login</a></div>
    </form>

    <form id="form-reset" novalidate hidden>
      <h1>Password baru</h1>
      <p class="sub">Buat password baru, minimal 8 karakter.</p>
      <div id="alert-reset" class="alert" role="alert" hidden></div>
      <div class="field"><label for="reset-password">Password baru</label>
        <div class="pw"><input type="password" id="reset-password" autocomplete="new-password" required><button type="button" class="toggle" data-target="reset-password">Lihat</button></div>
      </div>
      <div class="field"><label for="reset-confirm">Konfirmasi password</label>
        <div class="pw"><input type="password" id="reset-confirm" autocomplete="new-password" required><button type="button" class="toggle" data-target="reset-confirm">Lihat</button></div>
      </div>
      <button type="submit" class="btn" id="btn-reset">Simpan password</button>
      <div class="links"><a href="#" data-back>Kembali ke login</a></div>
    </form>
  </main>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/login.js"></script>
</body>
</html>
