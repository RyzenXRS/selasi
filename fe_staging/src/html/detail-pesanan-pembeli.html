<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detail Pesanan | SelaSI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
  <link rel="stylesheet" href="../assets/css/pembeli-app.css">
  <link rel="stylesheet" href="../assets/css/pembeli-belanja.css">
  <link rel="stylesheet" href="../assets/css/pembeli-pesanan.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <span class="brand">SelaSI</span>
      <nav class="nav" aria-label="Menu utama">
        <a href="katalog-pembeli.html"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l1 13H5z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg><span>Katalog Produk</span></a>
        <a aria-current="page" href="pesanan-pembeli.html"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6v3H9z"/><path d="M7 5.5H6a1 1 0 0 0-1 1V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V6.5a1 1 0 0 0-1-1h-1"/><path d="M9 12h6M9 16h4"/></svg><span>Pesanan</span></a>
        <a href="profil-pembeli.html"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg><span>Profil</span></a>
      </nav>
      <div class="sidebar-foot">
        <span id="user-email" class="user-email"></span>
        <button type="button" class="btn-logout" id="btn-logout"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg><span>Keluar</span></button>
      </div>
    </aside>

    <main class="page">
      <div class="topbar">
        <a class="cart-link" href="keranjang.html" aria-label="Keranjang"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20" r="1.2"/><circle cx="17" cy="20" r="1.2"/></svg><span class="cart-badge" id="cart-count" hidden>0</span></a>
      </div>
      <a class="kembali" href="pesanan-pembeli.html">&larr; Kembali ke Pesanan</a>
      <div class="page-head">
        <h1>Detail Pesanan</h1>
        <p class="sub" id="sub">Informasi lengkap pesananmu.</p>
      </div>

      <div id="alert" class="alert" role="alert" hidden></div>
      <div id="isi" hidden>
        <section class="panel" style="--i:0" aria-labelledby="h-info">
          <div class="detail-head"><h2 id="h-info">Informasi Pesanan</h2></div>
          <dl class="kv" id="kv"></dl>
        </section>
        <section class="panel" style="--i:1" aria-labelledby="h-prod">
          <h2 id="h-prod">Produk</h2>
          <div id="produk"></div>
        </section>
        <!-- UC42: kode QRIS (Midtrans Snap) untuk pesanan yang menunggu pembayaran -->
        <section class="panel" style="--i:2" id="panel-qris" aria-labelledby="h-qris" hidden>
          <h2 id="h-qris">Pembayaran QRIS</h2>
          <p class="qris-total">Total pembayaran <strong id="qris-total"></strong></p>
          <div id="snap-container"></div>
        </section>
        <div class="aksi-detail" id="aksi"></div>
      </div>
    </main>
  </div>

  <!-- Pop up konfirmasi pembatalan (UC49) -->
  <div class="modal" id="modal" hidden>
    <div class="dialog" role="alertdialog" aria-modal="true" aria-describedby="m-teks">
      <p id="m-teks"></p>
      <div class="actions">
        <button type="button" class="btn btn-danger" id="m-iya">Iya</button>
        <button type="button" class="btn btn-ghost" id="m-batal">Batal</button>
      </div>
    </div>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/pembeli-guard.js"></script>
  <script src="../assets/js/pembeli-cart.js"></script>
  <script src="../assets/js/pembeli-pesanan.js"></script>
  <script src="../assets/js/pembeli-ulasan.js"></script>
  <script src="../assets/js/detail-pesanan-pembeli.js"></script>
</body>
</html>
