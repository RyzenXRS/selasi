<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrasi Pembeli | SelaSI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/pembeli.css">
</head>
<body>
  <main class="card">
    <a class="brand" href="../index.html" aria-label="SelaSI, halaman utama">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21v-9"/><path d="M12 13c0-4 3-6 7-6 0 4-3 6-7 6z"/><path d="M12 16c0-3-2-5-6-5 0 3 2 5 6 5z"/></svg>
      SelaSI
    </a>

    <!-- UC33 Registrasi Pembeli -->
    <form id="form-register" novalidate>
      <h1>Registrasi</h1>
      <p class="hint">Buat akun Pembeli untuk memesan selada segar dari kebun SelaSI.</p>
      <div id="alert-register" class="alert" role="alert" hidden></div>

      <div class="field"><label for="reg-nama">Nama Lengkap</label>
        <input type="text" id="reg-nama" maxlength="100" autocomplete="name"></div>
      <div class="field"><label for="reg-telp">Nomor Telepon</label>
        <input type="tel" id="reg-telp" maxlength="20" autocomplete="tel"></div>
      <div class="field"><label for="reg-email">Email</label>
        <input type="email" id="reg-email" maxlength="50" autocomplete="email"></div>
      <div class="field"><label for="reg-password">Password</label>
        <div class="pw"><input type="password" id="reg-password" maxlength="50" autocomplete="new-password">
          <button type="button" class="toggle" data-target="reg-password">Lihat</button></div></div>
      <div class="field"><label for="reg-confirm">Konfirmasi Password</label>
        <div class="pw"><input type="password" id="reg-confirm" maxlength="50" autocomplete="new-password">
          <button type="button" class="toggle" data-target="reg-confirm">Lihat</button></div></div>

      <button type="submit" class="btn" id="btn-register">Daftar</button>
      <div class="links">
        <a href="login-pembeli.html">Sudah punya akun? Login</a>
        <a href="../index.html">Beranda</a>
      </div>
    </form>
  </main>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/pembeli-auth.js"></script>
</body>
</html>
