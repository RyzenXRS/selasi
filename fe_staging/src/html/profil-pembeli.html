<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profil Pembeli | SelaSI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
  <link rel="stylesheet" href="../assets/css/pembeli-app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <span class="brand">SelaSI</span>
      <nav class="nav" aria-label="Menu utama">
        <a href="katalog-pembeli.html"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l1 13H5z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg><span>Katalog Produk</span></a>
        <a href="pesanan-pembeli.html"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6v3H9z"/><path d="M7 5.5H6a1 1 0 0 0-1 1V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V6.5a1 1 0 0 0-1-1h-1"/><path d="M9 12h6M9 16h4"/></svg><span>Pesanan</span></a>
        <a aria-current="page" href="profil-pembeli.html"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg><span>Profil</span></a>
      </nav>
      <div class="sidebar-foot">
        <span id="user-email" class="user-email"></span>
        <button type="button" class="btn-logout" id="btn-logout"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg><span>Keluar</span></button>
      </div>
    </aside>

    <main class="page">
      <div class="page-head">
        <h1>Profil</h1>
        <p class="sub">Data akun Pembeli yang sedang masuk.</p>
      </div>

      <div id="alert" class="alert" role="alert" hidden></div>
      <div id="notice" class="alert success" role="status" tabindex="-1" hidden></div>
      <div id="loading" class="loading-box" aria-label="Memuat data akun"></div>

      <!-- UC36: Halaman Profile -->
      <section id="view" class="card" hidden>
                <div class="body">
          <div class="top">
            <div id="v-avatar" class="avatar" aria-hidden="true"></div>
            <div class="id">
              <h2 id="v-nama"></h2>
              <span id="v-role" class="badge"></span>
            </div>
            <button type="button" class="icon-btn" id="btn-edit" aria-label="Edit profil" title="Edit profil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span>Edit Profil</span></button>
          </div>
          <dl class="facts">
            <div><dt>Nama</dt><dd id="d-nama"></dd></div>
            <div><dt>Email</dt><dd id="d-email"></dd></div>
            <div><dt>Nomor Telepon</dt><dd id="d-telp"></dd></div>
            <div><dt>Role</dt><dd id="d-role"></dd></div>
            <div class="tile-foto"><dt>Foto Profil</dt><dd id="d-foto"></dd></div>
          </dl>
        </div>
      </section>

      <!-- UC37: Form Edit Halaman Profile -->
      <form id="edit" class="card" novalidate hidden>
                <div class="body">
          <h2 class="form-title">Edit Profil</h2>
          <div id="form-alert" class="alert" role="alert" hidden></div>

          <div class="photo-row">
            <div id="e-avatar" class="avatar" aria-hidden="true"></div>
            <div class="field">
              <label for="foto">Foto Profil</label>
              <input type="file" id="foto" accept="image/png,image/jpeg,image/webp">
              <p class="help">JPG, PNG, atau WEBP. Maksimal 2 MB. Kosongkan kalau tidak ingin mengganti.</p>
            </div>
          </div>

          <div class="form-grid">
            <div class="field span-2"><label for="nama">Nama</label>
              <input type="text" id="nama" maxlength="100" autocomplete="name"></div>
            <div class="field"><label for="email">Email</label>
              <input type="email" id="email" maxlength="100" autocomplete="email"></div>
            <div class="field"><label for="telp">Nomor Telepon</label>
              <input type="tel" id="telp" maxlength="20" autocomplete="tel"></div>
            <div class="field"><label for="role">Role</label>
              <input type="text" id="role" maxlength="20" disabled></div>
          </div>

          <div class="actions">
            <button type="submit" class="btn" id="btn-save">Simpan</button>
            <button type="button" class="btn btn-ghost" id="btn-cancel">Batal</button>
          </div>
        </div>
      </form>
    </main>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/pembeli-guard.js"></script>
  <script src="../assets/js/profil-pembeli.js"></script>
</body>
</html>
